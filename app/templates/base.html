<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Daily Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('main.index') }}">Início</a>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('main.painel') }}">Painel</a>
            <a href="{{ url_for('main.mapa') }}">Mapa</a>
            <a href="{{ url_for('main.relatorio') }}">Relatório</a>
            <a href="{{ url_for('main.logout') }}">Sair</a>
        {% else %}
            <a href="{{ url_for('main.login') }}">Entrar</a>
            <a href="{{ url_for('main.registo') }}">Registar</a>
        {% endif %}
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="mensagens">
                {% for msg in messages %}
                    <li>{{ msg }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
